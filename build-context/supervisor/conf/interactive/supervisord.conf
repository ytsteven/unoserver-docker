[supervisord]
pidfile = /var/run/supervisord.pid

# Note that at log level debug, the supervisord log file will record the stderr/stdout output
# of its child processes and extended info info about process state changes,
# which is useful for debugging a process which isn’t starting properly. 
# and also makes it available using `docker logs [container]`
#logfile = /var/log/supervisor/supervisord.log
logfile = /dev/stdout
logfile_maxbytes = 0
loglevel = info

# needed for supervisor to work
[unix_http_server]
file = /var/run/supervisor.sock
chmod = 0700
username = admin
password = %(ENV_UNIX_HTTP_SERVER_PASSWORD)s

# needed for supervisor to work
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# [inet_http_server]
# port = 127.0.0.1:9001
# username = admin
# password = %(ENV_INET_HTTP_SERVER_PASSWORD)

[supervisorctl]
serverurl = unix:///var/run/supervisor.sock

[program:unoserver]
command = /usr/local/bin/unoserver --interface 0.0.0.0 --port 2003 \
          --user-installation file:///tmp/uno-profile \
          --daemon
autostart = true
autorestart = false              ; 避免无限重启风暴
exitcodes = 0,2                  ; 2 表示 LibreOffice 初始化失败时不重启
startsecs = 5
stopasgroup = true               ; 停止时连同子进程一起杀掉
killasgroup = true
stdout_logfile = /var/log/unoserver.log
stderr_logfile = /var/log/unoserver.err
stdout_logfile_maxbytes = 5MB
stderr_logfile_maxbytes = 5MB